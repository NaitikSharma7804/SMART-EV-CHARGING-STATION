<!-- frontend/pages/nearby-explore.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nearby Amenities | EV Charge Hub</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Leaflet Map CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { 
            background-color: var(--background, #f8fafc); 
            margin: 0; 
            overflow: hidden; 
        }
        .layout { 
            display: flex; 
            height: calc(100vh - 72px); 
        }
        
        .sidebar {
            width: 420px;
            background: #ffffff;
            border-right: 1px solid var(--border, #e2e8f0);
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 2px 0 10px rgba(0,0,0,0.04);
        }
        
        .filters {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border, #e2e8f0);
        }
        
        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: 0.75rem;
        }

        .filter-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 0.45rem 0.85rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 500;
            color: #475569;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            transition: all 0.2s ease;
        }
        
        .filter-btn:hover {
            background: #e2e8f0;
            color: #1e293b;
        }

        .filter-btn.active {
            background: rgba(16, 185, 129, 0.15);
            color: #059669;
            border-color: #10b981;
            font-weight: 600;
        }

        .places-list {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 1.25rem;
        }

        .place-card {
            background: #ffffff;
            border: 1px solid var(--border, #e2e8f0);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .place-card:hover { 
            border-color: #10b981;
            box-shadow: 0 4px 8px rgba(0,0,0,0.04);
        }
        
        #map { 
            flex: 1; 
            height: 100%; 
            z-index: 1; 
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <header class="navbar" style="border-bottom: 1px solid var(--border, #e2e8f0); background: #ffffff; height: 72px; box-sizing: border-box;">
        <div class="nav-container" style="display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; height: 100%;">
            <a href="dashboard.html" class="logo" style="display: flex; align-items: center; gap: 0.5rem; font-weight: 700; text-decoration: none; color: #10b981; font-size: 1.25rem;">
                <i data-lucide="zap"></i> EV Charge Hub
            </a>
            <nav style="display: flex; align-items: center; gap: 1.5rem;">
                <a href="dashboard.html" style="text-decoration: none; color: #64748b;">Dashboard</a>
                <a href="search.html" style="text-decoration: none; color: #64748b;">Find Chargers</a>
                <a href="bookings.html" style="text-decoration: none; color: #64748b;">My Bookings</a>
            </nav>
        </div>
    </header>

    <div class="layout">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="filters">
                <h2 style="margin: 0 0 0.25rem 0; font-size: 1.35rem; color: #1e293b;">While you charge...</h2>
                <p style="color: #64748b; font-size: 0.85rem; margin: 0;">Find live amenities near your charging station.</p>
                
                <div class="filter-group">
                    <button class="filter-btn active" onclick="searchAmenities('cafe', this)">
                        <i data-lucide="coffee" style="width: 15px; height: 15px;"></i> Cafes
                    </button>
                    <button class="filter-btn" onclick="searchAmenities('restaurant', this)">
                        <i data-lucide="utensils" style="width: 15px; height: 15px;"></i> Food
                    </button>
                    <button class="filter-btn" onclick="searchAmenities('hotel', this)">
                        <i data-lucide="bed" style="width: 15px; height: 15px;"></i> Hotels
                    </button>
                    <button class="filter-btn" onclick="searchAmenities('hospital', this)">
                        <i data-lucide="activity" style="width: 15px; height: 15px;"></i> Hospitals
                    </button>
                    <button class="filter-btn" onclick="searchAmenities('mall', this)">
                        <i data-lucide="shopping-bag" style="width: 15px; height: 15px;"></i> Malls
                    </button>
                </div>
            </div>

            <div class="places-list" id="placesList">
                <div style="text-align: center; padding: 2.5rem 1rem; color: #64748b;">
                    <i data-lucide="map-pin" style="width: 32px; height: 32px; margin-bottom: 0.75rem; opacity: 0.5;"></i>
                    <p>Detecting your location...</p>
                </div>
            </div>
        </div>

        <!-- Map -->
        <div id="map"></div>
    </div>

    <script>
        lucide.createIcons();

        // 1. Initialize Map
        let map = L.map('map').setView([18.5204, 73.8567], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let userLat = 18.5204;
        let userLng = 73.8567;
        let markers = [];
        let userMarker = null;

        // In-memory cache so switching tabs is instant (0ms)
        const memoryCache = {};

        // Offline Instant Fallback Data for Pune (Just in case network is completely blocked)
        const demoFallbackData = {
            cafe: [
                { tags: { name: "Irani Cafe" }, lat: 18.5215, lon: 73.8540 },
                { tags: { name: "Starbucks Coffee" }, lat: 18.5170, lon: 73.8420 },
                { tags: { name: "Cafe Goodluck" }, lat: 18.5200, lon: 73.8415 },
                { tags: { name: "Barista Lavazza" }, lat: 18.5140, lon: 73.8390 }
            ],
            restaurant: [
                { tags: { name: "Vaishali Restaurant" }, lat: 18.5208, lon: 73.8412 },
                { tags: { name: "Barbeque Nation" }, lat: 18.5180, lon: 73.8500 },
                { tags: { name: "Le Plaisir" }, lat: 18.5135, lon: 73.8402 },
                { tags: { name: "Wadeshwar" }, lat: 18.5205, lon: 73.8408 }
            ],
            hotel: [
                { tags: { name: "JW Marriott Hotel" }, lat: 18.5332, lon: 73.8335 },
                { tags: { name: "The Pride Hotel" }, lat: 18.5310, lon: 73.8475 },
                { tags: { name: "Sheraton Grand" }, lat: 18.5290, lon: 73.8640 },
                { tags: { name: "Hotel Sagar Plaza" }, lat: 18.5185, lon: 73.8750 }
            ],
            hospital: [
                { tags: { name: "Deenanath Mangeshkar Hospital" }, lat: 18.5020, lon: 73.8290 },
                { tags: { name: "Sahyadri Super Speciality Hospital" }, lat: 18.5160, lon: 73.8340 },
                { tags: { name: "Poona Hospital & Research Centre" }, lat: 18.5145, lon: 73.8470 },
                { tags: { name: "Ruby Hall Clinic" }, lat: 18.5330, lon: 73.8770 }
            ],
            mall: [
                { tags: { name: "The Pavillion Mall" }, lat: 18.5340, lon: 73.8300 },
                { tags: { name: "Phoenix Marketcity" }, lat: 18.5620, lon: 73.9168 },
                { tags: { name: "Kumar Pacific Mall" }, lat: 18.5005, lon: 73.8760 }
            ]
        };

        // 2. Get User's Live Location
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(position => {
                userLat = position.coords.latitude;
                userLng = position.coords.longitude;
                
                map.setView([userLat, userLng], 15);
                
                if (userMarker) map.removeLayer(userMarker);
                userMarker = L.circleMarker([userLat, userLng], {
                    color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 0.8, radius: 8
                }).addTo(map).bindPopup("Your Location");

                searchAmenities('cafe', document.querySelector('.filter-btn'));
            }, () => {
                searchAmenities('cafe', document.querySelector('.filter-btn'));
            });
        }

        // 3. Fast Overpass Query with Fallback & Cache
        async function searchAmenities(type, btnElement) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');

            // Serve instantly from cache if previously loaded
            if (memoryCache[type] && memoryCache[type].length > 0) {
                renderPlaces(memoryCache[type], type);
                return;
            }

            const listEl = document.getElementById('placesList');
            listEl.innerHTML = `
                <div style="text-align: center; padding: 2.5rem 1rem; color: #64748b;">
                    <i data-lucide="loader" class="spin" style="margin-bottom: 0.75rem;"></i>
                    <p>Finding nearby ${type}s...</p>
                </div>
            `;
            lucide.createIcons();

            // Clear old map markers
            markers.forEach(m => map.removeLayer(m));
            markers = [];

            // Define accurate OSM tag mappings
            let tagFilter = `["amenity"="${type}"]`;
            if (type === 'hotel') tagFilter = `["tourism"="hotel"]`;
            if (type === 'mall') tagFilter = `["shop"="mall"]`;

            // FAST QUERY: Query 'node' only with a 4-second timeout limit to guarantee high speed
            const query = `
                [out:json][timeout:4];
                node${tagFilter}(around:3000,${userLat},${userLng});
                out body 15;
            `;

            const servers = [
                'https://overpass-api.de/api/interpreter',
                'https://overpass.kumi.systems/api/interpreter',
                'https://maps.mail.ru/osm/tools/overpass/api/interpreter'
            ];

            let places = [];
            let fetchedSuccessfully = false;

            for (let url of servers) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 3500);

                    const res = await fetch(url, {
                        method: 'POST',
                        body: query,
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);

                    if (res.ok) {
                        const data = await res.json();
                        places = (data.elements || []).filter(e => e.tags && e.tags.name);
                        if (places.length > 0) {
                            fetchedSuccessfully = true;
                            break;
                        }
                    }
                } catch (e) {
                    // Try next server
                }
            }

            // Fallback gracefully to demo data if servers are overloaded
            if (!fetchedSuccessfully || places.length === 0) {
                places = demoFallbackData[type] || [];
            }

            // Save in cache
            memoryCache[type] = places;
            renderPlaces(places, type);
        }

        // 4. Render Places on List & Map
        function renderPlaces(places, type) {
            const listEl = document.getElementById('placesList');

            // Clear existing map pins
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            
            if (places.length === 0) {
                listEl.innerHTML = `<div style="text-align: center; padding: 2.5rem 1rem; color: #64748b;"><p>No ${type}s found nearby.</p></div>`;
                return;
            }

            const greenIcon = L.icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [1, -34],
                shadowSize: [41, 41]
            });

            listEl.innerHTML = places.map((place, index) => {
                const name = place.tags.name;
                const lat = place.lat || (place.center && place.center.lat);
                const lng = place.lon || (place.center && place.center.lon);
                
                if (lat && lng) {
                    const marker = L.marker([lat, lng], { icon: greenIcon }).addTo(map)
                        .bindPopup(`<b>${name}</b><br><span style="text-transform: capitalize; color: #64748b;">${type}</span>`);
                    markers.push(marker);
                }

                return `
                    <div class="place-card" onclick="focusMap(${lat}, ${lng}, ${index})">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem;">
                            <div>
                                <h3 style="margin: 0 0 0.25rem 0; color: #1e293b; font-size: 1rem; font-weight: 600;">${name}</h3>
                                <span style="font-size: 0.8rem; color: #64748b; text-transform: capitalize;">${type}</span>
                            </div>
                            <button class="btn btn-outline btn-sm" onclick="openNav('${name.replace(/'/g, "\\'")}'); event.stopPropagation();" style="padding: 0.3rem 0.6rem; font-size: 0.78rem; display: flex; align-items: center; gap: 0.25rem;">
                                <i data-lucide="navigation" style="width: 13px; height: 13px;"></i> Route
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
            
            lucide.createIcons();
            
            if (markers.length > 0) {
                const group = new L.featureGroup(markers);
                map.fitBounds(group.getBounds().pad(0.1));
            }
        }

        // 5. Navigation & Map Focus Helpers
        function focusMap(lat, lng, index) {
            if (lat && lng) {
                map.setView([lat, lng], 16);
                if (markers[index]) markers[index].openPopup();
            }
        }

        function openNav(destinationName) {
            const destination = encodeURIComponent(destinationName + ", Pune, Maharashtra");
            window.open(`https://www.google.com/maps/dir/?api=1&destination=${destination}`, '_blank');
        }
    </script>
</body>
</html>
