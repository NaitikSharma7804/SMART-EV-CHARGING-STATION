<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | EV Charge Hub</title>

    <!-- Existing CSS -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- Premium UI -->
    <link rel="stylesheet" href="../css/premium-ui.css">

    <!-- React -->
    <script
        src="https://unpkg.com/react@18/umd/react.production.min.js"
        crossorigin>
    </script>

    <script
        src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
        crossorigin>
    </script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js">
    </script>

    <!-- Recharts -->
    <script
        src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js">
    </script>

    <script
        src="https://unpkg.com/recharts@2.1.9/umd/Recharts.js">
    </script>

    <!-- Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>


    <style>

        /* =====================================================
           ADMIN DASHBOARD — PREMIUM UI
        ===================================================== */

        :root {

            --admin-bg: #f5f7f6;

            --admin-sidebar: #090d0b;
            --admin-sidebar-soft: #111714;

            --admin-green: #22c55e;
            --admin-green-dark: #16a34a;

            --admin-text: #101828;
            --admin-muted: #667085;

            --admin-border: #e6e9e7;

            --admin-white: #ffffff;

            --admin-danger: #ef4444;

            --admin-warning: #f59e0b;

            --admin-shadow:
                0 8px 30px rgba(16, 24, 40, 0.06);

        }


        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            background: var(--admin-bg);

            color: var(--admin-text);

            font-family:
                'Inter',
                Arial,
                sans-serif;

        }


        button,
        input {

            font-family: inherit;

        }


        /* =====================================================
           LOADING
        ===================================================== */

        .admin-loading {

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 15px;

            background: var(--admin-bg);

        }


        .loading-spinner {

            width: 38px;
            height: 38px;

            border: 3px solid #dce3df;

            border-top-color: var(--admin-green);

            border-radius: 50%;

            animation:
                adminSpin .8s linear infinite;

        }


        @keyframes adminSpin {

            to {
                transform: rotate(360deg);
            }

        }


        .admin-loading p {

            margin: 0;

            color: var(--admin-muted);

            font-size: 13px;

        }


        /* =====================================================
           MAIN LAYOUT
        ===================================================== */

        .admin-layout {

            min-height: 100vh;

            display: flex;

        }


        /* =====================================================
           SIDEBAR
        ===================================================== */

        .admin-sidebar {

            width: 250px;

            min-height: 100vh;

            position: fixed;

            left: 0;
            top: 0;

            display: flex;

            flex-direction: column;

            background: var(--admin-sidebar);

            color: white;

            z-index: 100;

        }


        .admin-brand {

            height: 78px;

            padding: 0 22px;

            display: flex;

            align-items: center;

            gap: 11px;

            border-bottom:
                1px solid rgba(255,255,255,.07);

        }


        .admin-brand-icon {

            width: 39px;
            height: 39px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: var(--admin-green);

            color: #052e16;

            border-radius: 11px;

        }


        .admin-brand-icon svg {

            width: 19px;
            height: 19px;

        }


        .admin-brand-text {

            font-family:
                'Manrope',
                Arial,
                sans-serif;

            font-size: 16px;

            font-weight: 800;

            letter-spacing: -.02em;

        }


        .admin-brand-text span {

            display: block;

            margin-top: 2px;

            color: #667085;

            font-size: 9px;

            font-weight: 600;

            letter-spacing: .12em;

            text-transform: uppercase;

        }


        /* =====================================================
           SIDEBAR NAV
        ===================================================== */

        .admin-nav {

            flex: 1;

            padding: 24px 13px;

        }


        .admin-nav-label {

            padding: 0 11px;

            margin-bottom: 10px;

            color: #667085;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: .12em;

            text-transform: uppercase;

        }


        .admin-nav button {

            width: 100%;

            height: 46px;

            margin-bottom: 5px;

            padding: 0 12px;

            display: flex;

            align-items: center;

            gap: 12px;

            border: none;

            border-radius: 10px;

            background: transparent;

            color: #98a2b3;

            cursor: pointer;

            text-align: left;

            font-size: 13px;

            font-weight: 600;

            transition: .2s ease;

        }


        .admin-nav button svg {

            width: 17px;
            height: 17px;

        }


        .admin-nav button:hover {

            background:
                rgba(255,255,255,.05);

            color: white;

        }


        .admin-nav button.active {

            background:
                rgba(34,197,94,.12);

            color: #86efac;

        }


        .admin-nav button.active svg {

            color: var(--admin-green);

        }


        /* =====================================================
           SIDEBAR USER
        ===================================================== */

        .admin-sidebar-bottom {

            padding: 15px;

            border-top:
                1px solid rgba(255,255,255,.07);

        }


        .admin-profile {

            padding: 11px;

            margin-bottom: 10px;

            display: flex;

            align-items: center;

            gap: 10px;

            background:
                rgba(255,255,255,.04);

            border-radius: 11px;

        }


        .admin-avatar {

            width: 34px;
            height: 34px;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            background: #1f2937;

            color: #86efac;

            border-radius: 50%;

            font-size: 12px;

            font-weight: 800;

        }


        .admin-profile-info {

            min-width: 0;

        }


        .admin-profile-info strong {

            display: block;

            overflow: hidden;

            color: white;

            font-size: 11px;

            text-overflow: ellipsis;

            white-space: nowrap;

        }


        .admin-profile-info span {

            display: block;

            margin-top: 2px;

            color: #667085;

            font-size: 9px;

        }


        .admin-logout {

            width: 100%;

            height: 40px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            border: 1px solid rgba(255,255,255,.1);

            border-radius: 9px;

            background: transparent;

            color: #98a2b3;

            cursor: pointer;

            font-size: 12px;

            font-weight: 600;

            transition: .2s ease;

        }


        .admin-logout:hover {

            background:
                rgba(239,68,68,.1);

            color: #fca5a5;

            border-color:
                rgba(239,68,68,.2);

        }


        .admin-logout svg {

            width: 15px;
            height: 15px;

        }


        /* =====================================================
           MAIN CONTENT
        ===================================================== */

        .admin-main {

            width: calc(100% - 250px);

            margin-left: 250px;

            min-height: 100vh;

        }


        /* =====================================================
           TOP HEADER
        ===================================================== */

        .admin-topbar {

            height: 78px;

            padding: 0 34px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background: rgba(255,255,255,.90);

            backdrop-filter: blur(15px);

            border-bottom:
                1px solid var(--admin-border);

            position: sticky;

            top: 0;

            z-index: 50;

        }


        .admin-heading h1 {

            margin: 0;

            font-family:
                'Manrope',
                Arial,
                sans-serif;

            font-size: 23px;

            font-weight: 800;

            letter-spacing: -.035em;

        }


        .admin-heading p {

            margin: 4px 0 0;

            color: var(--admin-muted);

            font-size: 11px;

        }


        .admin-top-actions {

            display: flex;

            align-items: center;

            gap: 10px;

        }


        .admin-status {

            display: flex;

            align-items: center;

            gap: 7px;

            padding: 7px 10px;

            border: 1px solid var(--admin-border);

            border-radius: 9px;

            background: white;

            color: var(--admin-muted);

            font-size: 10px;

            font-weight: 600;

        }


        .admin-status-dot {

            width: 7px;
            height: 7px;

            background: var(--admin-green);

            border-radius: 50%;

            box-shadow:
                0 0 9px rgba(34,197,94,.6);

        }


        /* =====================================================
           CONTENT
        ===================================================== */

        .admin-content {

            padding: 30px 34px 60px;

        }


        /* =====================================================
           SECTION HEADER
        ===================================================== */

        .content-section-header {

            display: flex;

            align-items: flex-end;

            justify-content: space-between;

            margin-bottom: 20px;

        }


        .content-section-header h2 {

            margin: 0;

            font-family:
                'Manrope',
                Arial,
                sans-serif;

            font-size: 18px;

            font-weight: 800;

            letter-spacing: -.025em;

        }


        .content-section-header p {

            margin: 5px 0 0;

            color: var(--admin-muted);

            font-size: 11px;

        }


        /* =====================================================
           STATS
        ===================================================== */

        .admin-stats {

            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 15px;

            margin-bottom: 24px;

        }


        .admin-stat-card {

            padding: 20px;

            background: white;

            border:
                1px solid var(--admin-border);

            border-radius: 16px;

            box-shadow:
                0 2px 7px rgba(0,0,0,.025);

            transition: .25s ease;

        }


        .admin-stat-card:hover {

            transform:
                translateY(-3px);

            box-shadow:
                var(--admin-shadow);

        }


        .admin-stat-top {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 17px;

        }


        .admin-stat-icon {

            width: 40px;
            height: 40px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #ecfdf3;

            color: #16a34a;

            border-radius: 10px;

        }


        .admin-stat-icon svg {

            width: 18px;
            height: 18px;

        }


        .admin-stat-trend {

            display: flex;

            align-items: center;

            gap: 3px;

            color: #16a34a;

            font-size: 9px;

            font-weight: 700;

        }


        .admin-stat-trend svg {

            width: 11px;
            height: 11px;

        }


        .admin-stat-number {

            margin-bottom: 4px;

            font-family:
                'Manrope',
                Arial,
                sans-serif;

            color: var(--admin-text);

            font-size: 28px;

            font-weight: 800;

            letter-spacing: -.04em;

        }


        .admin-stat-label {

            color: var(--admin-muted);

            font-size: 11px;

            font-weight: 500;

        }


        /* =====================================================
           CHART
        ===================================================== */

        .admin-chart-card {

            height: 430px;

            padding: 24px;

            background: white;

            border:
                1px solid var(--admin-border);

            border-radius: 18px;

            box-shadow:
                0 2px 7px rgba(0,0,0,.025);

        }


        .chart-header {

            display: flex;

            align-items: flex-start;

            justify-content: space-between;

            margin-bottom: 15px;

        }


        .chart-header h3 {

            margin: 0;

            font-family:
                'Manrope',
                Arial,
                sans-serif;

            font-size: 16px;

            font-weight: 800;

        }


        .chart-header p {

            margin: 4px 0 0;

            color: var(--admin-muted);

            font-size: 10px;

        }


        .chart-label {

            padding: 7px 10px;

            background: #f1f5f3;

            color: #667085;

            border-radius: 8px;

            font-size: 9px;

            font-weight: 700;

        }


        .chart-area {

            height: 330px;

        }


        /* =====================================================
           TABLE
        ===================================================== */

        .admin-table-card {

            overflow: hidden;

            background: white;

            border:
                1px solid var(--admin-border);

            border-radius: 17px;

            box-shadow:
                0 2px 7px rgba(0,0,0,.025);

        }


        .admin-table-toolbar {

            min-height: 65px;

            padding: 13px 18px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            border-bottom:
                1px solid var(--admin-border);

        }


        .admin-table-toolbar h3 {

            margin: 0;

            font-family:
                'Manrope',
                Arial,
                sans-serif;

            font-size: 14px;

            font-weight: 800;

        }


        .admin-table-toolbar p {

            margin: 3px 0 0;

            color: var(--admin-muted);

            font-size: 10px;

        }


        .admin-search {

            width: 210px;

            height: 36px;

            padding: 0 12px;

            border:
                1px solid var(--admin-border);

            border-radius: 9px;

            outline: none;

            background: #fafbfa;

            font-size: 11px;

        }


        .admin-search:focus {

            border-color:
                var(--admin-green);

            background: white;

            box-shadow:
                0 0 0 3px
                rgba(34,197,94,.08);

        }


        .admin-table-wrapper {

            width: 100%;

            overflow-x: auto;

        }


        .admin-table {

            width: 100%;

            border-collapse: collapse;

        }


        .admin-table th {

            padding: 12px 18px;

            text-align: left;

            background: #fafbfa;

            border-bottom:
                1px solid var(--admin-border);

            color: #667085;

            font-size: 9px;

            font-weight: 800;

            letter-spacing: .07em;

            text-transform: uppercase;

            white-space: nowrap;

        }


        .admin-table td {

            padding: 15px 18px;

            border-bottom:
                1px solid #f0f2f1;

            color: #475467;

            font-size: 11px;

            white-space: nowrap;

        }


        .admin-table tbody tr {

            transition: .18s ease;

        }


        .admin-table tbody tr:hover {

            background: #fafcfb;

        }


        .admin-table tbody tr:last-child td {

            border-bottom: none;

        }


        .user-name-cell {

            display: flex;

            align-items: center;

            gap: 9px;

        }


        .table-avatar {

            width: 30px;
            height: 30px;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            background: #ecfdf3;

            color: #16a34a;

            border-radius: 9px;

            font-size: 10px;

            font-weight: 800;

        }


        .user-name {

            color: #101828;

            font-weight: 700;

        }


        .user-email {

            margin-top: 2px;

            color: #98a2b3;

            font-size: 9px;

        }


        /* =====================================================
           STATUS BADGES
        ===================================================== */

        .status-badge {

            display: inline-flex;

            align-items: center;

            gap: 5px;

            padding: 5px 9px;

            border-radius: 999px;

            font-size: 9px;

            font-weight: 800;

            text-transform: capitalize;

        }


        .status-dot {

            width: 5px;
            height: 5px;

            border-radius: 50%;

        }


        .status-active {

            background: #ecfdf3;

            color: #15803d;

        }


        .status-active .status-dot {

            background: #22c55e;

        }


        .status-blocked {

            background: #fef2f2;

            color: #b91c1c;

        }


        .status-blocked .status-dot {

            background: #ef4444;

        }


        .status-default {

            background: #f1f5f3;

            color: #667085;

        }


        .status-default .status-dot {

            background: #98a2b3;

        }


        /* =====================================================
           ACTION BUTTON
        ===================================================== */

        .table-action {

            height: 31px;

            padding: 0 10px;

            display: inline-flex;

            align-items: center;

            gap: 6px;

            border-radius: 8px;

            background: transparent;

            cursor: pointer;

            font-size: 9px;

            font-weight: 700;

            transition: .2s ease;

        }


        .table-action svg {

            width: 12px;
            height: 12px;

        }


        .table-action.block {

            color: #dc2626;

            border:
                1px solid #fecaca;

        }


        .table-action.block:hover {

            background: #fef2f2;

        }


        .table-action.unblock {

            color: #16a34a;

            border:
                1px solid #bbf7d0;

        }


        .table-action.unblock:hover {

            background: #ecfdf3;

        }


        /* =====================================================
           BOOKING ID
        ===================================================== */

        .booking-id {

            color: #101828;

            font-family: monospace;

            font-size: 10px;

            font-weight: 700;

        }


        .station-cell {

            color: #101828;

            font-weight: 600;

        }


        .amount-cell {

            color: #101828;

            font-family:
                'Manrope',
                Arial,
                sans-serif;

            font-weight: 800;

        }


        .date-cell strong {

            display: block;

            color: #344054;

            font-size: 10px;

        }


        .date-cell span {

            display: block;

            margin-top: 3px;

            color: #98a2b3;

            font-size: 9px;

        }


        /* =====================================================
           EMPTY STATE
        ===================================================== */

        .admin-empty {

            padding: 55px 20px;

            text-align: center;

            color: var(--admin-muted);

        }


        .admin-empty-icon {

            width: 45px;
            height: 45px;

            margin: 0 auto 12px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #f1f5f3;

            color: #98a2b3;

            border-radius: 12px;

        }


        .admin-empty-icon svg {

            width: 20px;
            height: 20px;

        }


        .admin-empty p {

            margin: 0;

            font-size: 11px;

        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media(max-width: 1100px) {

            .admin-stats {

                grid-template-columns:
                    repeat(2, 1fr);

            }

        }


        @media(max-width: 800px) {

            .admin-sidebar {

                width: 70px;

            }


            .admin-brand {

                justify-content: center;

                padding: 0;

            }


            .admin-brand-text {

                display: none;

            }


            .admin-nav-label {

                display: none;

            }


            .admin-nav button {

                justify-content: center;

                padding: 0;

            }


            .admin-nav button span {

                display: none;

            }


            .admin-profile {

                justify-content: center;

                padding: 7px;

            }


            .admin-profile-info {

                display: none;

            }


            .admin-logout {

                font-size: 0;

            }


            .admin-main {

                width: calc(100% - 70px);

                margin-left: 70px;

            }


            .admin-topbar {

                padding: 0 20px;

            }


            .admin-content {

                padding: 25px 20px 50px;

            }

        }


        @media(max-width: 600px) {

            .admin-stats {

                grid-template-columns: 1fr;

            }


            .admin-topbar {

                height: 70px;

            }


            .admin-heading h1 {

                font-size: 19px;

            }


            .admin-status {

                display: none;

            }


            .admin-content {

                padding:
                    20px 14px 40px;

            }


            .admin-chart-card {

                height: 350px;

                padding: 18px;

            }


            .chart-area {

                height: 260px;

            }


            .admin-table-toolbar {

                align-items: flex-start;

                flex-direction: column;

            }


            .admin-search {

                width: 100%;

            }

        }

    </style>

</head>


<body>


<div id="admin-root"></div>


<!-- Existing API helper -->
<script src="../js/api.js"></script>


<script type="text/babel">

    const {
        useState,
        useEffect
    } = React;


    const {
        LineChart,
        Line,
        XAxis,
        YAxis,
        CartesianGrid,
        Tooltip,
        ResponsiveContainer
    } = window.Recharts;


    /* =====================================================
       ICON HELPER
    ===================================================== */

    function Icon({ name, size = 17 }) {

        return (
            <i
                data-lucide={name}
                style={{
                    width: size,
                    height: size
                }}
            ></i>
        );

    }


    /* =====================================================
       ADMIN APPLICATION
    ===================================================== */

    function AdminApp() {

        const [activeTab, setActiveTab] =
            useState('dashboard');

        const [user, setUser] =
            useState(null);


        /* ---------------------------------------------
           ADMIN AUTHENTICATION
        --------------------------------------------- */

        useEffect(() => {

            const token =
                localStorage.getItem('ev_token');


            const userData =
                JSON.parse(
                    localStorage.getItem(
                        'ev_user'
                    ) || '{}'
                );


            if (
                !token ||
                userData.role !== 'ADMIN'
            ) {

                window.location.href =
                    'login.html';

            } else {

                setUser(userData);

            }

        }, []);


        /* ---------------------------------------------
           LOGOUT
        --------------------------------------------- */

        const handleLogout = () => {

            localStorage.removeItem(
                'ev_token'
            );

            localStorage.removeItem(
                'ev_user'
            );

            window.location.href =
                'login.html';

        };


        /* ---------------------------------------------
           LOADING
        --------------------------------------------- */

        if (!user) {

            return (

                <div className="admin-loading">

                    <div className="loading-spinner">
                    </div>

                    <p>
                        Loading admin workspace...
                    </p>

                </div>

            );

        }


        const tabTitles = {

            dashboard: {
                title: 'Dashboard',
                description:
                    'Monitor your EV charging platform'
            },

            users: {
                title: 'Manage Users',
                description:
                    'View and manage registered users'
            },

            bookings: {
                title: 'Bookings',
                description:
                    'Monitor all charging reservations'
            }

        };


        const current =
            tabTitles[activeTab];


        return (

            <div className="admin-layout">


                {/* =================================================
                   SIDEBAR
                ================================================= */}

                <aside className="admin-sidebar">


                    <div className="admin-brand">

                        <div className="admin-brand-icon">

                            <Icon
                                name="zap"
                                size={20}
                            />

                        </div>


                        <div className="admin-brand-text">

                            EV Charge Hub

                            <span>
                                Administration
                            </span>

                        </div>

                    </div>


                    <nav className="admin-nav">

                        <div className="admin-nav-label">
                            Workspace
                        </div>


                        <button
                            className={
                                activeTab === 'dashboard'
                                    ? 'active'
                                    : ''
                            }
                            onClick={() =>
                                setActiveTab(
                                    'dashboard'
                                )
                            }
                        >

                            <Icon name="layout-dashboard" />

                            <span>
                                Dashboard
                            </span>

                        </button>


                        <button
                            className={
                                activeTab === 'users'
                                    ? 'active'
                                    : ''
                            }
                            onClick={() =>
                                setActiveTab(
                                    'users'
                                )
                            }
                        >

                            <Icon name="users" />

                            <span>
                                Manage Users
                            </span>

                        </button>


                        <button
                            className={
                                activeTab === 'bookings'
                                    ? 'active'
                                    : ''
                            }
                            onClick={() =>
                                setActiveTab(
                                    'bookings'
                                )
                            }
                        >

                            <Icon name="calendar-days" />

                            <span>
                                Bookings
                            </span>

                        </button>

                    </nav>


                    <div className="admin-sidebar-bottom">


                        <div className="admin-profile">

                            <div className="admin-avatar">

                                {
                                    user.name
                                        ? user.name
                                            .charAt(0)
                                            .toUpperCase()
                                        : 'A'
                                }

                            </div>


                            <div className="admin-profile-info">

                                <strong>
                                    {user.name || 'Administrator'}
                                </strong>

                                <span>
                                    Administrator
                                </span>

                            </div>

                        </div>


                        <button
                            className="admin-logout"
                            onClick={handleLogout}
                        >

                            <Icon name="log-out" />

                            Logout

                        </button>

                    </div>

                </aside>


                {/* =================================================
                   MAIN
                ================================================= */}

                <main className="admin-main">


                    {/* TOP BAR */}

                    <header className="admin-topbar">


                        <div className="admin-heading">

                            <h1>
                                {current.title}
                            </h1>

                            <p>
                                {current.description}
                            </p>

                        </div>


                        <div className="admin-top-actions">

                            <div className="admin-status">

                                <span className="admin-status-dot">
                                </span>

                                System Online

                            </div>

                        </div>

                    </header>


                    {/* CONTENT */}

                    <div className="admin-content">


                        {activeTab === 'dashboard' && (

                            <DashboardView />

                        )}


                        {activeTab === 'users' && (

                            <UsersView />

                        )}


                        {activeTab === 'bookings' && (

                            <BookingsView />

                        )}

                    </div>

                </main>

            </div>

        );

    }


    /* =====================================================
       DASHBOARD VIEW
    ===================================================== */

    function DashboardView() {

        const [stats, setStats] =
            useState(null);

        const [loading, setLoading] =
            useState(true);


        useEffect(() => {

            async function fetchStats() {

                try {

                    const res =
                        await apiCall(
                            '/admin/dashboard'
                        );

                    setStats(
                        res.data
                    );

                } catch (error) {

                    console.error(
                        error
                    );

                    alert(
                        'Failed to load dashboard data'
                    );

                } finally {

                    setLoading(false);

                }

            }


            fetchStats();

        }, []);


        if (loading) {

            return (

                <div className="admin-loading"
                     style={{
                         minHeight: '400px'
                     }}>

                    <div className="loading-spinner">
                    </div>

                    <p>
                        Loading analytics...
                    </p>

                </div>

            );

        }


        if (!stats) {

            return null;

        }


        const chartData =
            stats.chartData.dailyBookings.map(
                d => ({

                    ...d,

                    date:
                        new Date(
                            d.date
                        ).toLocaleDateString(
                            'en-US',
                            {
                                month: 'short',
                                day: 'numeric'
                            }
                        )

                })
            );


        return (

            <>


                {/* =========================================
                   WELCOME
                ========================================= */}

                <div
                    className="content-section-header"
                    style={{
                        marginBottom: '22px'
                    }}
                >

                    <div>

                        <h2>
                            Overview
                        </h2>

                        <p>
                            Here's what's happening
                            across your platform.
                        </p>

                    </div>

                </div>


                {/* =========================================
                   STATISTICS
                ========================================= */}

                <div className="admin-stats">


                    <StatCard
                        icon="users"
                        label="Total Users"
                        value={stats.totalUsers}
                    />


                    <StatCard
                        icon="map-pin"
                        label="Total Stations"
                        value={stats.totalStations}
                    />


                    <StatCard
                        icon="zap"
                        label="Active Sessions"
                        value={stats.activeSessions}
                    />


                    <StatCard
                        icon="indian-rupee"
                        label="Total Revenue"
                        value={
                            `₹${stats.totalRevenue}`
                        }
                    />

                </div>


                {/* =========================================
                   CHART
                ========================================= */}

                <div className="admin-chart-card">


                    <div className="chart-header">

                        <div>

                            <h3>
                                Daily Bookings
                            </h3>

                            <p>
                                Booking activity over time
                            </p>

                        </div>


                        <span className="chart-label">

                            BOOKINGS TREND

                        </span>

                    </div>


                    <div className="chart-area">

                        <ResponsiveContainer
                            width="100%"
                            height="100%"
                        >

                            <LineChart
                                data={chartData}
                                margin={{
                                    top: 10,
                                    right: 10,
                                    left: -20,
                                    bottom: 5
                                }}
                            >

                                <CartesianGrid
                                    strokeDasharray="4 4"
                                    vertical={false}
                                    stroke="#edf0ee"
                                />


                                <XAxis
                                    dataKey="date"
                                    stroke="#98a2b3"
                                    tick={{
                                        fontSize: 9
                                    }}
                                    axisLine={false}
                                    tickLine={false}
                                />


                                <YAxis
                                    stroke="#98a2b3"
                                    tick={{
                                        fontSize: 9
                                    }}
                                    axisLine={false}
                                    tickLine={false}
                                />


                                <Tooltip
                                    contentStyle={{
                                        borderRadius: '12px',
                                        border:
                                            '1px solid #e6e9e7',
                                        boxShadow:
                                            '0 10px 30px rgba(0,0,0,.08)',
                                        fontSize: '11px'
                                    }}
                                />


                                <Line
                                    type="monotone"
                                    dataKey="count"
                                    stroke="#22c55e"
                                    strokeWidth={3}
                                    dot={false}
                                    activeDot={{
                                        r: 6
                                    }}
                                />

                            </LineChart>

                        </ResponsiveContainer>

                    </div>

                </div>

            </>

        );

    }


    /* =====================================================
       STAT CARD
    ===================================================== */

    function StatCard({
        icon,
        label,
        value
    }) {

        return (

            <div className="admin-stat-card">


                <div className="admin-stat-top">

                    <div className="admin-stat-icon">

                        <Icon
                            name={icon}
                            size={18}
                        />

                    </div>


                    <div className="admin-stat-trend">

                        <Icon
                            name="activity"
                            size={11}
                        />

                        Live

                    </div>

                </div>


                <div className="admin-stat-number">

                    {value}

                </div>


                <div className="admin-stat-label">

                    {label}

                </div>

            </div>

        );

    }


    /* =====================================================
       USERS VIEW
    ===================================================== */

    function UsersView() {

        const [users, setUsers] =
            useState([]);

        const [search, setSearch] =
            useState('');


        const fetchUsers = async () => {

            try {

                const res =
                    await apiCall(
                        '/admin/users'
                    );

                setUsers(
                    res.data
                );

            } catch (e) {

                console.error(e);

                alert(
                    'Failed to fetch users'
                );

            }

        };


        useEffect(() => {

            fetchUsers();

        }, []);


        /* ---------------------------------------------
           TOGGLE USER STATUS
        --------------------------------------------- */

        const toggleStatus =
            async (
                id,
                currentStatus
            ) => {

                const newStatus =
                    currentStatus === 'active'
                        ? 'blocked'
                        : 'active';


                if (
                    !confirm(
                        `Are you sure you want to ${newStatus} this user?`
                    )
                ) {

                    return;

                }


                try {

                    await apiCall(
                        `/admin/users/${id}/status`,
                        'PUT',
                        {
                            status:
                                newStatus
                        }
                    );


                    fetchUsers();

                } catch (e) {

                    console.error(e);

                    alert(
                        'Failed to update status'
                    );

                }

            };


        const filteredUsers =
            users.filter(
                u => {

                    const value =
                        search.toLowerCase();

                    return (

                        (u.name || '')
                            .toLowerCase()
                            .includes(value)

                        ||

                        (u.email || '')
                            .toLowerCase()
                            .includes(value)

                        ||

                        (u.mobile || '')
                            .toLowerCase()
                            .includes(value)

                    );

                }
            );


        return (

            <div className="admin-table-card">


                <div className="admin-table-toolbar">

                    <div>

                        <h3>
                            User Management
                        </h3>

                        <p>
                            {users.length}
                            {' '}
                            registered users
                        </p>

                    </div>


                    <input
                        className="admin-search"
                        type="text"
                        placeholder="Search users..."
                        value={search}
                        onChange={
                            e =>
                                setSearch(
                                    e.target.value
                                )
                        }
                    />

                </div>


                <div className="admin-table-wrapper">

                    <table className="admin-table">

                        <thead>

                            <tr>

                                <th>
                                    User
                                </th>

                                <th>
                                    Mobile
                                </th>

                                <th>
                                    Status
                                </th>

                                <th>
                                    Action
                                </th>

                            </tr>

                        </thead>


                        <tbody>


                            {filteredUsers.length === 0 ? (

                                <tr>

                                    <td
                                        colSpan="4"
                                        style={{
                                            padding: 0
                                        }}
                                    >

                                        <div className="admin-empty">

                                            <div className="admin-empty-icon">

                                                <Icon
                                                    name="users"
                                                    size={20}
                                                />

                                            </div>

                                            <p>
                                                No users found.
                                            </p>

                                        </div>

                                    </td>

                                </tr>

                            ) : (

                                filteredUsers.map(
                                    u => (

                                        <tr
                                            key={u.id}
                                        >


                                            <td>

                                                <div className="user-name-cell">

                                                    <div className="table-avatar">

                                                        {
                                                            u.name
                                                                ? u.name
                                                                    .charAt(0)
                                                                    .toUpperCase()
                                                                : 'U'
                                                        }

                                                    </div>


                                                    <div>

                                                        <div className="user-name">

                                                            {u.name}

                                                        </div>

                                                        <div className="user-email">

                                                            {u.email}

                                                        </div>

                                                    </div>

                                                </div>

                                            </td>


                                            <td>

                                                {u.mobile || '—'}

                                            </td>


                                            <td>

                                                <StatusBadge
                                                    status={
                                                        u.status
                                                    }
                                                />

                                            </td>


                                            <td>

                                                <button
                                                    onClick={() =>
                                                        toggleStatus(
                                                            u.id,
                                                            u.status
                                                        )
                                                    }
                                                    className={
                                                        `table-action ${
                                                            u.status === 'active'
                                                                ? 'block'
                                                                : 'unblock'
                                                        }`
                                                    }
                                                >

                                                    <Icon
                                                        name={
                                                            u.status === 'active'
                                                                ? 'user-x'
                                                                : 'user-check'
                                                        }
                                                        size={12}
                                                    />

                                                    {
                                                        u.status === 'active'
                                                            ? 'Block'
                                                            : 'Unblock'
                                                    }

                                                </button>

                                            </td>


                                        </tr>

                                    )
                                )

                            )}

                        </tbody>

                    </table>

                </div>

            </div>

        );

    }


    /* =====================================================
       BOOKINGS VIEW
    ===================================================== */

    function BookingsView() {

        const [bookings, setBookings] =
            useState([]);

        const [search, setSearch] =
            useState('');


        useEffect(() => {

            async function fetchBookings() {

                try {

                    const res =
                        await apiCall(
                            '/admin/bookings'
                        );

                    setBookings(
                        res.data
                    );

                } catch (e) {

                    console.error(e);

                    alert(
                        'Failed to fetch bookings'
                    );

                }

            }


            fetchBookings();

        }, []);


        const filteredBookings =
            bookings.filter(
                b => {

                    const value =
                        search.toLowerCase();

                    return (

                        String(
                            b.id
                        )
                            .toLowerCase()
                            .includes(value)

                        ||

                        (b.user_name || '')
                            .toLowerCase()
                            .includes(value)

                        ||

                        (b.station_name || '')
                            .toLowerCase()
                            .includes(value)

                    );

                }
            );


        return (

            <div className="admin-table-card">


                <div className="admin-table-toolbar">

                    <div>

                        <h3>
                            Booking Management
                        </h3>

                        <p>
                            {bookings.length}
                            {' '}
                            total bookings
                        </p>

                    </div>


                    <input
                        className="admin-search"
                        type="text"
                        placeholder="Search bookings..."
                        value={search}
                        onChange={
                            e =>
                                setSearch(
                                    e.target.value
                                )
                        }
                    />

                </div>


                <div className="admin-table-wrapper">

                    <table className="admin-table">

                        <thead>

                            <tr>

                                <th>
                                    Booking
                                </th>

                                <th>
                                    User
                                </th>

                                <th>
                                    Station
                                </th>

                                <th>
                                    Date / Time
                                </th>

                                <th>
                                    Amount
                                </th>

                                <th>
                                    Status
                                </th>

                            </tr>

                        </thead>


                        <tbody>


                            {filteredBookings.length === 0 ? (

                                <tr>

                                    <td
                                        colSpan="6"
                                        style={{
                                            padding: 0
                                        }}
                                    >

                                        <div className="admin-empty">

                                            <div className="admin-empty-icon">

                                                <Icon
                                                    name="calendar-x"
                                                    size={20}
                                                />

                                            </div>

                                            <p>
                                                No bookings found.
                                            </p>

                                        </div>

                                    </td>

                                </tr>

                            ) : (

                                filteredBookings.map(
                                    b => (

                                        <tr
                                            key={b.id}
                                        >


                                            <td>

                                                <span className="booking-id">

                                                    #{b.id}

                                                </span>

                                            </td>


                                            <td>

                                                <div className="user-name-cell">

                                                    <div className="table-avatar">

                                                        {
                                                            b.user_name
                                                                ? b.user_name
                                                                    .charAt(0)
                                                                    .toUpperCase()
                                                                : 'U'
                                                        }

                                                    </div>

                                                    <span className="user-name">

                                                        {b.user_name}

                                                    </span>

                                                </div>

                                            </td>


                                            <td>

                                                <span className="station-cell">

                                                    {b.station_name}

                                                </span>

                                            </td>


                                            <td>

                                                <div className="date-cell">

                                                    <strong>

                                                        {
                                                            new Date(
                                                                b.booking_date
                                                            )
                                                                .toLocaleDateString(
                                                                    'en-IN',
                                                                    {
                                                                        day:
                                                                            '2-digit',
                                                                        month:
                                                                            'short',
                                                                        year:
                                                                            'numeric'
                                                                    }
                                                                )
                                                        }

                                                    </strong>


                                                    <span>

                                                        <Icon
                                                            name="clock"
                                                            size={10}
                                                        />

                                                        {' '}

                                                        {
                                                            b.start_time
                                                                ? b.start_time.slice(
                                                                    0,
                                                                    5
                                                                )
                                                                : '--'
                                                        }

                                                        {' – '}

                                                        {
                                                            b.end_time
                                                                ? b.end_time.slice(
                                                                    0,
                                                                    5
                                                                )
                                                                : '--'
                                                        }

                                                    </span>

                                                </div>

                                            </td>


                                            <td>

                                                <span className="amount-cell">

                                                    ₹{b.amount}

                                                </span>

                                            </td>


                                            <td>

                                                <StatusBadge
                                                    status={
                                                        b.status
                                                    }
                                                />

                                            </td>


                                        </tr>

                                    )
                                )

                            )}

                        </tbody>

                    </table>

                </div>

            </div>

        );

    }


    /* =====================================================
       STATUS BADGE
    ===================================================== */

    function StatusBadge({
        status
    }) {

        const normalized =
            String(
                status || ''
            ).toLowerCase();


        let className =
            'status-default';


        if (
            normalized === 'active' ||
            normalized === 'confirmed' ||
            normalized === 'completed' ||
            normalized === 'success'
        ) {

            className =
                'status-active';

        }


        if (
            normalized === 'blocked' ||
            normalized === 'cancelled' ||
            normalized === 'failed'
        ) {

            className =
                'status-blocked';

        }


        return (

            <span
                className={
                    `status-badge ${className}`
                }
            >

                <span className="status-dot">
                </span>

                {status || 'Unknown'}

            </span>

        );

    }


    /* =====================================================
       MOUNT APPLICATION
    ===================================================== */

    const root =
        ReactDOM.createRoot(
            document.getElementById(
                'admin-root'
            )
        );


    root.render(
        <AdminApp />
    );


    /* =====================================================
       LUCIDE ICON REFRESH
    ===================================================== */

    setTimeout(() => {

        if (
            window.lucide
        ) {

            lucide.createIcons();

        }

    }, 100);

</script>


</body>

</html>
