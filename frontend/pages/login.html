<!-- frontend/pages/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EV Charge Hub</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-page">

    <div class="auth-card">
        <div class="auth-header">
            <a href="../index.html" class="logo" style="justify-content: center; margin-bottom: 1rem;">
                <i data-lucide="zap"></i> EV Charge Hub
            </a>
            <h2>Welcome Back</h2>
            <p style="color: var(--text-muted);">Enter your credentials to access your account</p>
        </div>

        <div id="loginAlert" class="alert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control" required placeholder="john@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" required placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Login</button>
            
            <div style="margin: 1.5rem 0; text-align: center; color: var(--text-muted); position: relative;">
                <hr style="border: 0; border-top: 1px solid var(--border); position: absolute; width: 100%; top: 50%;">
                <span style="background: var(--surface); padding: 0 10px; position: relative;">OR</span>
            </div>

            <button type="button" class="btn btn-block google-btn">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google" width="18" height="18">
                Continue with Google
            </button>
        </form>

        <div class="auth-links">
            Don't have an account? <a href="register.html">Register here</a><br>
            <a href="forgot-password.html" style="font-weight: normal; margin-top: 0.5rem; display: inline-block;">Forgot password?</a>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        lucide.createIcons();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const alertBox = document.getElementById('loginAlert');

            loginBtn.textContent = 'Logging in...';
            loginBtn.disabled = true;
            alertBox.className = 'alert'; 

            try {
                const data = await apiCall('/auth/login', 'POST', { email, password });
                
                // Store JWT and User data
                localStorage.setItem('ev_token', data.token);
                localStorage.setItem('ev_user', JSON.stringify(data.user));

                alertBox.textContent = 'Login successful! Redirecting...';
                alertBox.classList.add('success');

                // Redirect based on role
                setTimeout(() => {
                    if (data.user.role === 'ADMIN') {
                        window.location.href = 'admin-dashboard.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                }, 1000);

            } catch (error) {
                alertBox.textContent = error.message;
                alertBox.classList.add('error');
                loginBtn.textContent = 'Login';
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
